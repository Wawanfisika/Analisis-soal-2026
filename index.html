
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Analisis Soal Ujian - SMAIT Buahati Islamic School Mamuju</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- React 18, React DOM, Babel, SheetJS (XLSX) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Print Stylesheet for F4 / Folio Landscape */
        @media print {
            @page {
                size: 330mm 215.9mm landscape; /* Ukuran Kertas F4 / Folio Landscape */
                margin: 8mm;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            body {
                background-color: white !important;
                color: black !important;
            }
            .card-box {
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            table {
                width: 100% !important;
                border-collapse: collapse !important;
            }
            th, td {
                border: 1px solid #333 !important;
                padding: 3px 5px !important;
            }
            .signature-section {
                display: flex !important;
                justify-content: space-around !important;
                margin-top: 25px !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'analisis-soal-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let db = null;
        let auth = null;

        if (firebaseConfig) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
            } catch (e) {
                console.error("Firebase init error:", e);
            }
        }

        const { useState, useEffect, useMemo } = React;

        // Default Master Question Types & Labels
        const QUESTION_TYPES = [
            { id: 'PG', label: 'Pilihan Ganda (PG)', defaultMaxScore: 2 },
            { id: 'PGK', label: 'Pilihan Ganda Kompleks (PGK)', defaultMaxScore: 4 },
            { id: 'Memasangkan', label: 'Memasangkan', defaultMaxScore: 4 },
            { id: 'BS', label: 'Benar / Salah (BS)', defaultMaxScore: 2 },
            { id: 'Isian', label: 'Isian Singkat', defaultMaxScore: 5 },
            { id: 'Uraian', label: 'Uraian / Essay', defaultMaxScore: 10 }
        ];

        function App() {
            // Active Tab State
            const [activeTab, setActiveTab] = useState('input');

            // Cloud Save & Auth States
            const [user, setUser] = useState(null);
            const [cloudStatus, setCloudStatus] = useState('idle');

            // Print Font & Style Customization
            const [fontFamily, setFontFamily] = useState('Inter');
            const [fontSize, setFontSize] = useState('8.5pt');

            // Header & Exam Metadata State
            const [headerData, setHeaderData] = useState({
                instansi: 'YAYASAN BUAHATI ISLAMIC SCHOOL',
                namaSekolah: 'SMAIT BUAHATI ISLAMIC SCHOOL MAMUJU',
                namaUjian: 'PENILAIAN AKHIR SEMESTER (PAS) GANJIL',
                mataPelajaran: 'Fisika',
                kelas: 'X (Sepuluh)',
                semester: '1 (Ganjil)',
                tahunAjaran: '2025/2026',
                tanggalUjian: '10 Desember 2025',
                kktp: 75,
                logoUrl: 'https://placehold.co/120x120/0284c7/ffffff?text=SMAIT'
            });

            // Bobot Jenis Soal (Percentage Weights for Grade Calculation)
            const [weights, setWeights] = useState({
                PG: 30,
                PGK: 20,
                Memasangkan: 10,
                BS: 10,
                Isian: 15,
                Uraian: 15
            });

            // Soal / Questions Setup State
            const [questions, setQuestions] = useState([
                { id: 'q1', nomor: 1, type: 'PG', maxScore: 2 },
                { id: 'q2', nomor: 2, type: 'PG', maxScore: 2 },
                { id: 'q3', nomor: 3, type: 'PG', maxScore: 2 },
                { id: 'q4', nomor: 4, type: 'PG', maxScore: 2 },
                { id: 'q5', nomor: 5, type: 'PG', maxScore: 2 },
                { id: 'q6', nomor: 6, type: 'PGK', maxScore: 4 },
                { id: 'q7', nomor: 7, type: 'PGK', maxScore: 4 },
                { id: 'q8', nomor: 8, type: 'Memasangkan', maxScore: 4 },
                { id: 'q9', nomor: 9, type: 'BS', maxScore: 2 },
                { id: 'q10', nomor: 10, type: 'Isian', maxScore: 5 },
                { id: 'q11', nomor: 11, type: 'Uraian', maxScore: 10 }
            ]);

            // Data Siswa & Skor Matrix State
            const [students, setStudents] = useState([
                {
                    id: 's1',
                    nama: 'Ahmad Abdullah',
                    nis: '1001',
                    scores: { q1: 2, q2: 2, q3: 2, q4: 2, q5: 2, q6: 4, q7: 4, q8: 4, q9: 2, q10: 5, q11: 9 }
                },
                {
                    id: 's2',
                    nama: 'Aisyah Humaira',
                    nis: '1002',
                    scores: { q1: 2, q2: 2, q3: 2, q4: 2, q5: 2, q6: 3, q7: 4, q8: 3, q9: 2, q10: 4, q11: 8 }
                },
                {
                    id: 's3',
                    nama: 'Bilal Ramadan',
                    nis: '1003',
                    scores: { q1: 2, q2: 0, q3: 2, q4: 2, q5: 0, q6: 2, q7: 2, q8: 2, q9: 2, q10: 3, q11: 6 }
                },
                {
                    id: 's4',
                    nama: 'Fatimah Az-Zahra',
                    nis: '1004',
                    scores: { q1: 0, q2: 2, q3: 0, q4: 0, q5: 2, q6: 1, q7: 2, q8: 1, q9: 0, q10: 2, q11: 4 }
                },
                {
                    id: 's5',
                    nama: 'Muhammad Al-Fatih',
                    nis: '1005',
                    scores: { q1: 2, q2: 2, q3: 2, q4: 2, q5: 2, q6: 4, q7: 3, q8: 4, q9: 2, q10: 5, q11: 10 }
                }
            ]);

            // Signatures Section State
            const [signatures, setSignatures] = useState([
                {
                    id: 'sig1',
                    tempatTanggal: 'Mamuju, 10 Desember 2025',
                    jabatan: 'Mengetahui,\nKepala SMAIT Buahati',
                    nama: "H. Mas'ud, S.Pd., M.Pd.",
                    idType: 'NIP',
                    nip: '19750812 200212 1 002'
                },
                {
                    id: 'sig2',
                    tempatTanggal: 'Mamuju, 10 Desember 2025',
                    jabatan: 'Guru Mata Pelajaran Fisika',
                    nama: 'Darmawan, S.Pd., M.Si., Gr',
                    idType: 'NUPTK',
                    nip: '19890520 201403 1 004'
                }
            ]);

            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth error:", err);
                        try {
                            await signInAnonymously(auth);
                        } catch (e2) {
                            console.error("Fallback anonymous auth error:", e2);
                        }
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!db || !user) return;
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'exam_backups', 'current_session');

                const loadSavedData = async () => {
                    try {
                        const snap = await getDoc(docRef);
                        if (snap.exists()) {
                            const data = snap.data();
                            if (data.headerData) setHeaderData(data.headerData);
                            if (data.weights) setWeights(data.weights);
                            if (data.questions) setQuestions(data.questions);
                            if (data.students) setStudents(data.students);
                            if (data.signatures) setSignatures(data.signatures);
                            setCloudStatus('loaded');
                            showToast('Data otomatis dipulihkan dari Cloud Server!');
                        }
                    } catch (err) {
                        console.error("Error loading cloud backup:", err);
                    }
                };
                loadSavedData();
            }, [user]);

            useEffect(() => {
                if (!db || !user) return;
                setCloudStatus('saving');

                const timer = setTimeout(async () => {
                    try {
                        const dataToSave = {
                            headerData,
                            weights,
                            questions,
                            students,
                            signatures,
                            lastSaved: new Date().toISOString()
                        };
                        const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'exam_backups', 'current_session');
                        await setDoc(docRef, dataToSave);
                        setCloudStatus('saved');
                    } catch (err) {
                        console.error("Error auto-saving to Firestore:", err);
                        setCloudStatus('error');
                    }
                }, 1500);

                return () => clearTimeout(timer);
            }, [headerData, weights, questions, students, signatures, user]);

            const [isLoggedIn, setIsLoggedIn] = useState(() => {
                return localStorage.getItem('app_is_logged_in') === 'true';
            });
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loginError, setLoginError] = useState('');

            // Notification Feedback Box
            const [toastMessage, setToastMessage] = useState('');

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            const handleExportBackupJSON = () => {
                try {
                    const backupObj = {
                        application: "Aplikasi Analisis Soal Ujian - SMAIT Buahati",
                        version: "1.0",
                        exportDate: new Date().toISOString(),
                        headerData,
                        weights,
                        questions,
                        students,
                        signatures
                    };
                    const jsonString = JSON.stringify(backupObj, null, 2);
                    const blob = new Blob([jsonString], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.href = url;
                    const safeSubject = (headerData.mataPelajaran || 'Ujian').replace(/[^a-zA-Z0-9]/g, '_');
                    const safeClass = (headerData.kelas || 'Kelas').replace(/[^a-zA-Z0-9]/g, '_');
                    link.download = `Backup_Analisis_${safeSubject}_${safeClass}_${new Date().toISOString().slice(0,10)}.json`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                    showToast('File cadangan data (.json) berhasil diunduh!');
                } catch (e) {
                    console.error("Backup JSON export error:", e);
                    showToast('Gagal mengunduh file cadangan data.');
                }
            };

            const handleImportBackupJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (data && data.headerData && data.questions && data.students) {
                            if (data.headerData) setHeaderData(data.headerData);
                            if (data.weights) setWeights(data.weights);
                            if (data.questions) setQuestions(data.questions);
                            if (data.students) setStudents(data.students);
                            if (data.signatures) setSignatures(data.signatures);
                            showToast('Data berhasil dipulihkan dari file backup JSON!');
                        } else {
                            showToast('Format file backup JSON tidak valid.');
                        }
                    } catch (err) {
                        console.error("Backup JSON import error:", err);
                        showToast('Gagal membaca file JSON. Pastikan file tidak rusak.');
                    }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const handleResetData = () => {
                if (window.confirm("Apakah Anda yakin ingin mengembalikan seluruh data ke pengaturan awal (reset)? Semua perubahan saat ini akan ditimpa.")) {
                    setHeaderData({
                        instansi: 'YAYASAN BUAHATI ISLAMIC SCHOOL',
                        namaSekolah: 'SMAIT BUAHATI ISLAMIC SCHOOL MAMUJU',
                        namaUjian: 'PENILAIAN AKHIR SEMESTER (PAS) GANJIL',
                        mataPelajaran: 'Fisika',
                        kelas: 'X (Sepuluh)',
                        semester: '1 (Ganjil)',
                        tahunAjaran: '2025/2026',
                        tanggalUjian: '10 Desember 2025',
                        kktp: 75,
                        logoUrl: 'https://placehold.co/120x120/0284c7/ffffff?text=SMAIT'
                    });
                    setQuestions([
                        { id: 'q1', nomor: 1, type: 'PG', maxScore: 2 },
                        { id: 'q2', nomor: 2, type: 'PG', maxScore: 2 },
                        { id: 'q3', nomor: 3, type: 'PG', maxScore: 2 }
                    ]);
                    setStudents([]);
                    showToast('Data berhasil di-reset ke bawaan.');
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (loginUser.trim() === 'Buahati' && loginPass === 'admin123') {
                    setIsLoggedIn(true);
                    localStorage.setItem('app_is_logged_in', 'true');
                    setLoginError('');
                    showToast('Berhasil login sebagai Buahati!');
                } else {
                    setLoginError('Username atau Password salah!');
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                localStorage.removeItem('app_is_logged_in');
                setLoginUser('');
                setLoginPass('');
                showToast('Berhasil keluar dari akun.');
            };

            // Total Maximum Raw Score Calculation
            const totalMaxRawScore = useMemo(() => {
                return questions.reduce((sum, q) => sum + (Number(q.maxScore) || 0), 0);
            }, [questions]);

            // Weight percentage total check
            const totalWeightPercent = useMemo(() => {
                return Object.values(weights).reduce((sum, w) => sum + (Number(w) || 0), 0);
            }, [weights]);

            // Calculated Student Final Scores
            const processedStudents = useMemo(() => {
                return students.map((student, idx) => {
                    let totalRawScore = 0;
                    
                    const typeAchieved = { PG: 0, PGK: 0, Memasangkan: 0, BS: 0, Isian: 0, Uraian: 0 };
                    const typeMax = { PG: 0, PGK: 0, Memasangkan: 0, BS: 0, Isian: 0, Uraian: 0 };

                    questions.forEach(q => {
                        const score = Number(student.scores[q.id]) || 0;
                        const maxSc = Number(q.maxScore) || 0;
                        totalRawScore += score;

                        if (typeAchieved[q.type] !== undefined) {
                            typeAchieved[q.type] += score;
                            typeMax[q.type] += maxSc;
                        }
                    });

                    let weightedScore = 0;
                    Object.keys(weights).forEach(type => {
                        if (typeMax[type] > 0) {
                            const ratio = typeAchieved[type] / typeMax[type];
                            weightedScore += ratio * (Number(weights[type]) || 0);
                        }
                    });

                    const rawPercentage = totalMaxRawScore > 0 ? (totalRawScore / totalMaxRawScore) * 100 : 0;
                    const finalScore = totalWeightPercent > 0 ? Number(weightedScore.toFixed(1)) : Number(rawPercentage.toFixed(1));

                    const isPass = finalScore >= (Number(headerData.kktp) || 75);

                    return {
                        ...student,
                        no: idx + 1,
                        totalRawScore,
                        finalScore,
                        isPass,
                        typeAchieved,
                        typeMax
                    };
                });
            }, [students, questions, weights, totalMaxRawScore, totalWeightPercent, headerData.kktp]);

            const classStats = useMemo(() => {
                if (processedStudents.length === 0) return { avg: 0, highest: 0, lowest: 0, passCount: 0, failCount: 0, passRate: 0 };
                
                const scores = processedStudents.map(s => s.finalScore);
                const sum = scores.reduce((a, b) => a + b, 0);
                const avg = (sum / scores.length).toFixed(1);
                const highest = Math.max(...scores);
                const lowest = Math.min(...scores);
                const passCount = processedStudents.filter(s => s.isPass).length;
                const failCount = processedStudents.length - passCount;
                const passRate = ((passCount / processedStudents.length) * 100).toFixed(1);

                return { avg, highest, lowest, passCount, failCount, passRate };
            }, [processedStudents]);

            const itemAnalysis = useMemo(() => {
                if (students.length === 0 || questions.length === 0) return [];

                const sorted = [...processedStudents].sort((a, b) => b.totalRawScore - a.totalRawScore);
                const groupSize = Math.max(1, Math.round(sorted.length * 0.27));
                const upperGroup = sorted.slice(0, groupSize);
                const lowerGroup = sorted.slice(-groupSize);

                return questions.map((q) => {
                    const maxScore = Number(q.maxScore) || 1;
                    
                    const totalScore = students.reduce((sum, s) => sum + (Number(s.scores[q.id]) || 0), 0);
                    const avgScore = totalScore / students.length;
                    
                    const pIndex = avgScore / maxScore;
                    let pCategory = 'Sedang';
                    if (pIndex > 0.70) pCategory = 'Mudah';
                    else if (pIndex < 0.30) pCategory = 'Sulit';

                    const upperAvg = upperGroup.reduce((sum, s) => sum + (Number(s.scores[q.id]) || 0), 0) / groupSize;
                    const lowerAvg = lowerGroup.reduce((sum, s) => sum + (Number(s.scores[q.id]) || 0), 0) / groupSize;
                    const dIndex = (upperAvg - lowerAvg) / maxScore;

                    let dCategory = 'Cukup';
                    if (dIndex >= 0.40) dCategory = 'Sangat Baik';
                    else if (dIndex >= 0.30) dCategory = 'Baik';
                    else if (dIndex >= 0.20) dCategory = 'Cukup';
                    else dCategory = 'Jelek';

                    let rekomendasi = 'Diterima';
                    if (dIndex < 0.20 || pIndex < 0.15 || pIndex > 0.90) {
                        rekomendasi = 'Dibuang / Perbaiki Total';
                    } else if (dIndex < 0.30 || pIndex < 0.30 || pIndex > 0.70) {
                        rekomendasi = 'Direvisi';
                    }

                    return {
                        ...q,
                        avgScore: avgScore.toFixed(2),
                        pIndex: pIndex.toFixed(2),
                        pCategory,
                        dIndex: dIndex.toFixed(2),
                        dCategory,
                        rekomendasi
                    };
                });
            }, [questions, students, processedStudents]);

            const handleAddQuestion = () => {
                const newNum = questions.length + 1;
                const newId = 'q_' + Date.now();
                setQuestions([...questions, { id: newId, nomor: newNum, type: 'PG', maxScore: 2 }]);
                showToast(`Soal nomor ${newNum} berhasil ditambahkan.`);
            };

            const handleRemoveQuestion = (id) => {
                if (questions.length <= 1) {
                    showToast('Jumlah soal minimal adalah 1.');
                    return;
                }
                const updated = questions.filter(q => q.id !== id).map((q, idx) => ({ ...q, nomor: idx + 1 }));
                setQuestions(updated);
                showToast('Soal berhasil dihapus.');
            };

            const handleQuestionChange = (id, field, value) => {
                setQuestions(questions.map(q => {
                    if (q.id === id) {
                        const updated = { ...q, [field]: value };
                        if (field === 'type') {
                            const defaultType = QUESTION_TYPES.find(t => t.id === value);
                            if (defaultType) updated.maxScore = defaultType.defaultMaxScore;
                        }
                        return updated;
                    }
                    return q;
                }));
            };

            const handleScoreChange = (studentId, questionId, val) => {
                const q = questions.find(item => item.id === questionId);
                let numVal = Number(val);
                if (isNaN(numVal)) numVal = 0;
                if (numVal < 0) numVal = 0;
                if (q && numVal > q.maxScore) numVal = q.maxScore;

                setStudents(students.map(s => {
                    if (s.id === studentId) {
                        return {
                            ...s,
                            scores: { ...s.scores, [questionId]: numVal }
                        };
                    }
                    return s;
                }));
            };

            const handleAddStudent = () => {
                const newId = 's_' + Date.now();
                const defaultScores = {};
                questions.forEach(q => defaultScores[q.id] = 0);
                
                setStudents([...students, {
                    id: newId,
                    nama: `Siswa Baru ${students.length + 1}`,
                    nis: `${1000 + students.length + 1}`,
                    scores: defaultScores
                }]);
                showToast('Siswa baru berhasil ditambahkan.');
            };

            const handleDownloadStudentTemplate = () => {
                const sampleStudents = [
                    { nis: '0051234561', nama: 'Ahmad Abdullah' },
                    { nis: '0051234562', nama: 'Aisyah Humaira' },
                    { nis: '0051234563', nama: 'Bilal Ramadan' },
                    { nis: '0051234564', nama: 'Fatimah Az-Zahra' },
                    { nis: '0051234565', nama: 'Muhammad Al-Fatih' }
                ];

                const templateData = sampleStudents.map((s) => {
                    const row = {
                        'NISN / NIS': s.nis,
                        'Nama Siswa': s.nama
                    };
                    questions.forEach(q => {
                        const colKey = `Soal ${q.nomor} (${q.type})`;
                        row[colKey] = q.maxScore;
                    });
                    return row;
                });

                const worksheet = XLSX.utils.json_to_sheet(templateData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Template Skor Siswa");
                XLSX.writeFile(workbook, `Template_Import_Skor_${headerData.mataPelajaran}_${headerData.kelas}.xlsx`);
                showToast('Template Excel beserta kolom skor soal berhasil diunduh!');
            };

            const handleImportStudentExcel = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        if (!data || data.length === 0) {
                            showToast('File Excel kosong atau format tidak sesuai.');
                            return;
                        }

                        const newStudents = data.map((row, idx) => {
                            const nis = row['NISN / NIS'] || row['NISN'] || row['NIS'] || row['nisn'] || row['nis'] || `${1000 + idx + 1}`;

                                                <i className="fa-solid fa-box-archive text-sky-600"></i>
                                                Penyimpanan & Cadangan Data
                                            </h2>
                                            <p className="text-sm text-slate-500">Kelola auto-sync cloud serta buat berkas cadangan offline agar data analisis Anda selalu aman.</p>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="text-xs px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 font-bold flex items-center gap-1.5">
                                                <i className="fa-solid fa-cloud"></i>
                                                {cloudStatus === 'saving' ? 'Proses Auto-Sync...' : 'Cloud Auto-Sync Aktif'}
                                            </span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div className="bg-sky-50/70 border border-sky-200 rounded-xl p-5 space-y-3">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-lg bg-sky-600 text-white flex items-center justify-center text-lg font-bold shadow-xs">
                                                    <i className="fa-solid fa-cloud-arrow-up"></i>
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-slate-800">1. Penyimpanan Cloud Firestore</h3>
                                                    <p className="text-xs text-slate-500">Tersimpan otomatis saat mengedit data</p>
                                                </div>
                                            </div>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Setiap kali Anda mengubah nilai, menambah siswa, atau mengubah pengaturan ujian, sistem secara otomatis mensinkronkan data ke Cloud Firestore. Apabila halaman direfresh atau dibuka kembali, data terbaru akan otomatis dimuat.
                                            </p>
                                            <div className="pt-2 border-t border-sky-200/60 flex items-center justify-between text-xs text-sky-800 font-medium">
                                                <span>Status Server:</span>
                                                <span className="font-bold bg-white px-2.5 py-1 rounded border border-sky-200 text-emerald-700">
                                                    <i className="fa-solid fa-circle-check text-emerald-500 mr-1"></i> Terhubung & Ter-sync
                                                </span>
                                            </div>
                                        </div>

                                        <div className="bg-amber-50/70 border border-amber-200 rounded-xl p-5 space-y-3">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-lg bg-amber-600 text-white flex items-center justify-center text-lg font-bold shadow-xs">
                                                    <i className="fa-solid fa-file-shield"></i>
                                                </div>
                                                <div>
                                                    <h3 className="font-bold text-slate-800">2. Berkas Cadangan (.JSON)</h3>
                                                    <p className="text-xs text-slate-500">Simpan salinan data fisik ke Komputer/Laptop</p>
                                                </div>
                                            </div>
                                            <p className="text-xs text-slate-600 leading-relaxed">
                                                Unduh berkas cadangan offline format <code>.json</code> untuk disimpan di Flashdisk, Google Drive, atau komputer Anda. Berkas ini dapat diunggah kembali di kemudian hari.
                                            </p>
                                            
                                            <div className="pt-3 flex flex-wrap gap-2">
                                                <button 
                                                    onClick={handleExportBackupJSON}
                                                    className="px-3.5 py-2 bg-amber-600 hover:bg-amber-700 text-white font-semibold text-xs rounded-lg shadow-xs transition-colors flex items-center gap-1.5"
                                                >
                                                    <i className="fa-solid fa-download"></i> Unduh Cadangan JSON
                                                </button>

                                                <label className="px-3.5 py-2 bg-slate-700 hover:bg-slate-800 text-white font-semibold text-xs rounded-lg shadow-xs cursor-pointer transition-colors flex items-center gap-1.5">
                                                    <i className="fa-solid fa-upload"></i> Pulihkan Dari JSON
                                                    <input 
                                                        type="file" 
                                                        accept=".json" 
                                                        onChange={handleImportBackupJSON}
                                                        className="hidden" 
                                                    />
                                                </label>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="border-t border-slate-200 pt-5">
                                        <div className="bg-rose-50 border border-rose-200 rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                                            <div>
                                                <h4 className="font-bold text-rose-900 text-sm flex items-center gap-1.5">
                                                    <i className="fa-solid fa-triangle-exclamation"></i> Reset Seluruh Data ke Bawaan
                                                </h4>
                                                <p className="text-xs text-rose-700 mt-0.5">Hapus seluruh inputan saat ini dan kembalikan ke pengaturan awal.</p>
                                            </div>
                                            <button 
                                                onClick={handleResetData}
                                                className="px-3.5 py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold text-xs rounded-lg shadow-xs transition-colors whitespace-nowrap"
                                            >
                                                Reset Seluruh Data
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 8: PRATINJAU CETAK */}
                        {activeTab === 'cetak' && (
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-4 no-print space-y-4">
                                    <div className="flex flex-wrap items-center justify-between gap-4">
                                        <div className="flex items-center gap-2">
                                            <i className="fa-solid fa-sliders text-sky-600 text-lg"></i>
                                            <h3 className="font-bold text-slate-800">Pengaturan Tampilan Cetak (F4 Landscape)</h3>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <button 
                                                onClick={() => window.print()} 
                                                className="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-sm rounded-lg shadow-sm transition-colors flex items-center gap-2"
                                            >
                                                <i className="fa-solid fa-print"></i> Cetak / Simpan PDF
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 pt-3 border-t border-slate-100">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Jenis Font Document:</label>
                                            <select 
                                                value={fontFamily} 
                                                onChange={(e) => setFontFamily(e.target.value)}
                                                className="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 bg-slate-50"
                                            >
                                                <option value="Inter">Inter (Modern Clean)</option>
                                                <option value="Arial">Arial (Standard Sans)</option>
                                                <option value="'Times New Roman', serif">Times New Roman (Formal Serif)</option>
                                                <option value="'Roboto', sans-serif">Roboto</option>
                                                <option value="Courier New, monospace">Courier New (Monospace)</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 mb-1">Ukuran Font (Font Size):</label>
                                            <select 
                                                value={fontSize} 
                                                onChange={(e) => setFontSize(e.target.value)}
                                                className="w-full px-3 py-1.5 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 bg-slate-50"
                                            >
                                                <option value="7.5pt">Sangat Kecil (7.5 pt)</option>
                                                <option value="8pt">Kecil (8 pt)</option>
                                                <option value="8.5pt">Standar Padat (8.5 pt)</option>
                                                <option value="9pt">Sedang (9 pt)</option>
                                                <option value="9.5pt">Besar (9.5 pt)</option>
                                                <option value="10pt">Sangat Besar (10 pt)</option>
                                                <option value="11pt">Extra Besar (11 pt)</option>
                                                <option value="12pt">Jumbo (12 pt)</option>
                                                <option value="13pt">Jumbo+ (13 pt)</option>
                                                <option value="14pt">Super (14 pt)</option>
                                                <option value="15pt">Maksimal (15 pt)</option>
                                            </select>
                                        </div>

                                        <div className="col-span-1 sm:col-span-2 flex items-center text-xs text-slate-500 bg-sky-50 p-2.5 rounded-lg border border-sky-100">
                                            <i className="fa-solid fa-circle-info text-sky-600 text-base mr-2 shrink-0"></i>
                                            <span>Dokumen dikonfigurasi khusus untuk cetak kertas <strong>F4 / Folio (330mm x 215.9mm)</strong> posisi <strong>Landscape</strong>.</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="overflow-x-auto pb-6">
                                    <div 
                                        className="bg-white mx-auto shadow-md border border-slate-300 p-8 min-w-[1000px]"
                                        style={{ 
                                            fontFamily: fontFamily, 
                                            fontSize: fontSize,
                                            lineHeight: 1.3 
                                        }}
                                    >
                                        <div className="flex items-center border-b-4 border-double border-slate-800 pb-3 mb-4">
                                            {headerData.logoUrl && (
                                                <img 
                                                    src={headerData.logoUrl} 
                                                    alt="Logo" 
                                                    className="w-20 h-20 object-contain mr-4"
                                                    onError={(e) => e.target.style.display = 'none'}
                                                />
                                            )}
                                            <div className="text-center flex-1">
                                                <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-600">{headerData.instansi}</h3>
                                                <h1 className="text-lg font-extrabold uppercase text-slate-900 tracking-wide">{headerData.namaSekolah}</h1>
                                                <h2 className="text-sm font-bold text-slate-800 mt-0.5">LAPORAN HASIL ANALISIS SOAL UJIAN & KETUNTASAN BELAJAR</h2>
                                                <p className="text-xs text-slate-600 font-medium">
                                                    {headerData.namaUjian} — TAHUN AJARAN {headerData.tahunAjaran}
                                                </p>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-x-8 text-xs mb-4 pb-3 border-b border-slate-200">
                                            <div className="space-y-1">
                                                <div className="flex"><span className="w-32 font-semibold">Mata Pelajaran</span>: <span>{headerData.mataPelajaran}</span></div>
                                                <div className="flex"><span className="w-32 font-semibold">Kelas / Semester</span>: <span>{headerData.kelas} / {headerData.semester}</span></div>
                                                <div className="flex"><span className="w-32 font-semibold">Tanggal Ujian</span>: <span>{headerData.tanggalUjian}</span></div>
                                            </div>
                                            <div className="space-y-1">
                                                <div className="flex"><span className="w-32 font-semibold">KKTP / KKM</span>: <span className="font-bold">{headerData.kktp} Poin</span></div>
                                                <div className="flex"><span className="w-32 font-semibold">Jumlah Peserta</span>: <span>{students.length} Siswa</span></div>
                                                <div className="flex"><span className="w-32 font-semibold">Jumlah Soal</span>: <span>{questions.length} Soal</span></div>
                                            </div>
                                        </div>

                                        <div className="space-y-2 mb-6">
                                            <h4 className="font-bold uppercase text-xs border-b border-slate-400 pb-1">I. Hasil Penilaian & Ketuntasan Siswa</h4>
                                            <table className="w-full text-left text-xs border-collapse border border-slate-800">
                                                <thead>
                                                    <tr className="bg-slate-100 font-bold border-b border-slate-800 text-slate-800">
                                                        <th className="p-1.5 border border-slate-800 text-center w-8">No</th>
                                                        <th className="p-1.5 border border-slate-800 w-24">NISN / NIS</th>
                                                        <th className="p-1.5 border border-slate-800">Nama Siswa</th>
                                                        {questions.map(q => (
                                                            <th key={q.id} className="p-1 border border-slate-800 text-center">
                                                                S{q.nomor}
                                                            </th>
                                                        ))}
                                                        <th className="p-1.5 border border-slate-800 text-center">Skor Mentah</th>
                                                        <th className="p-1.5 border border-slate-800 text-center">Nilai Akhir</th>
                                                        <th className="p-1.5 border border-slate-800 text-center">Ketuntasan</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {processedStudents.map(s => (
                                                        <tr key={s.id} className="border-b border-slate-800">
                                                            <td className="p-1 border border-slate-800 text-center">{s.no}</td>
                                                            <td className="p-1 border border-slate-800">{s.nis}</td>
                                                            <td className="p-1 border border-slate-800 font-semibold">{s.nama}</td>
                                                            {questions.map(q => (
                                                                <td key={q.id} className="p-1 border border-slate-800 text-center">
                                                                    {s.scores[q.id] !== undefined ? s.scores[q.id] : 0}
                                                                </td>
                                                            ))}
                                                            <td className="p-1 border border-slate-800 text-center font-bold">{s.totalRawScore}</td>
                                                            <td className="p-1 border border-slate-800 text-center font-bold">{s.finalScore}</td>
                                                            <td className="p-1 border border-slate-800 text-center font-bold">
                                                                {s.isPass ? 'TUNTAS' : 'REMEDIAL'}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="grid grid-cols-4 gap-3 text-xs mb-6">
                                            <div className="border border-slate-400 p-2 rounded">
                                                <div className="text-slate-500">Rata-Rata Kelas:</div>
                                                <div className="font-bold text-sm">{classStats.avg}</div>
                                            </div>
                                            <div className="border border-slate-400 p-2 rounded">
                                                <div className="text-slate-500">Tertinggi / Terendah:</div>
                                                <div className="font-bold text-sm">{classStats.highest} / {classStats.lowest}</div>
                                            </div>
                                            <div className="border border-slate-400 p-2 rounded">
                                                <div className="text-slate-500">Tuntas / Remedial:</div>
                                                <div className="font-bold text-sm">{classStats.passCount} / {classStats.failCount} Siswa</div>
                                            </div>
                                            <div className="border border-slate-400 p-2 rounded">
                                                <div className="text-slate-500">Ketuntasan Klasikal:</div>
                                                <div className="font-bold text-sm">{classStats.passRate}%</div>
                                            </div>
                                        </div>

                                        <div className="space-y-2 mb-6">
                                            <h4 className="font-bold uppercase text-xs border-b border-slate-400 pb-1">II. Analisis Kualitas Butir Soal</h4>
                                            <table className="w-full text-left text-xs border-collapse border border-slate-800">
                                                <thead>
                                                    <tr className="bg-slate-100 font-bold border-b border-slate-800">
                                                        <th className="p-1 border border-slate-800 text-center">No</th>
                                                        <th className="p-1 border border-slate-800">Jenis Soal</th>
                                                        <th className="p-1 border border-slate-800 text-center">Skor Max</th>
                                                        <th className="p-1 border border-slate-800 text-center">Tingkat Kesukaran (P)</th>
                                                        <th className="p-1 border border-slate-800 text-center">Kategori Kesukaran</th>
                                                        <th className="p-1 border border-slate-800 text-center">Daya Beda (D)</th>
                                                        <th className="p-1 border border-slate-800 text-center">Kategori Daya Beda</th>
                                                        <th className="p-1 border border-slate-800 text-center">Rekomendasi Soal</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {itemAnalysis.map(item => (
                                                        <tr key={item.id} className="border-b border-slate-800">
                                                            <td className="p-1 border border-slate-800 text-center">{item.nomor}</td>
                                                            <td className="p-1 border border-slate-800">{item.type}</td>
                                                            <td className="p-1 border border-slate-800 text-center">{item.maxScore}</td>
                                                            <td className="p-1 border border-slate-800 text-center">{item.pIndex}</td>
                                                            <td className="p-1 border border-slate-800 text-center">{item.pCategory}</td>
                                                            <td className="p-1 border border-slate-800 text-center">{item.dIndex}</td>
                                                            <td className="p-1 border border-slate-800 text-center">{item.dCategory}</td>
                                                            <td className="p-1 border border-slate-800 text-center font-bold">{item.rekomendasi}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>

                                        <div className="mt-5 space-y-2">
                                            <h4 className="font-bold uppercase text-xs border-b border-slate-400 pb-1">
                                                III. Rekomendasi dan Tindak Lanjut
                                            </h4>
                                            
                                            <div className="grid grid-cols-2 gap-4 text-xs">
                                                <div className="border border-slate-300 p-2.5 rounded">
                                                    <h5 className="font-bold text-slate-800 mb-1 flex items-center gap-1">
                                                        <span>•</span> Rekomendasi untuk Guru Mata Pelajaran:
                                                    </h5>
                                                    <ol className="list-decimal pl-4 space-y-1 text-slate-700">
                                                        <li>Melaksanakan pembelajaran remedial terdiferensiasi (Mastery Learning) pada indikator soal dengan ketuntasan rendah.</li>
                                                        <li>Melakukan revisi/redesain butir soal yang terlalu sulit atau memiliki daya beda kurang memadai.</li>
                                                        <li>Memberikan umpan balik deskriptif secara langsung pada lembar jawaban siswa.</li>
                                                    </ol>
                                                </div>

                                                <div className="border border-slate-300 p-2.5 rounded">
                                                    <h5 className="font-bold text-slate-800 mb-1 flex items-center gap-1">
                                                        <span>•</span> Rekomendasi untuk Siswa Remedial:
                                                    </h5>
                                                    <ol className="list-decimal pl-4 space-y-1 text-slate-700">
                                                        <li>Melakukan analisis dan refleksi kesalahan mandiri pada lembar jawaban ujian.</li>
                                                        <li>Mengikuti program pendampingan tutor sebaya bersama siswa yang tuntas.</li>
                                                        <li>Mengerjakan latihan soal terstruktur (spaced retrieval practice) sebelum tes remedial ulang.</li>
                                                    </ol>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-8 signature-section flex justify-between items-end text-xs">
                                            {signatures.map((sig, index) => (
                                                <div key={sig.id || index} className="text-center min-w-[200px]">
                                                    <p className="mb-1 text-slate-600">{sig.tempatTanggal}</p>
                                                    <p className="font-bold text-slate-800 whitespace-pre-line">{sig.jabatan}</p>
                                                    <div className="h-16"></div>
                                                    <p className="font-bold underline text-slate-900">{sig.nama}</p>
                                                    <p className="text-slate-600">
                                                        {sig.idType && sig.idType !== '-' 
                                                            ? `${sig.idType}. ${sig.nip || '-'}` 
                                                            : (sig.nip && sig.nip !== '-' ? `NIP. ${sig.nip}` : '-')}
                                                    </p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white border-t border-slate-200 py-3 px-4 text-center text-xs text-slate-500 no-print">
                        <p>© 2026 Aplikasi Analisis Soal Ujian — Dikembangkan oleh <strong>Darmawan, S.Pd., M.Si., Gr</strong> (SMAIT Buahati Islamic School Mamuju)</p>
                    </footer>
                </div>
            );
        }

        // Render Application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
